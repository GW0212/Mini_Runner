<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Runner</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="hud">
      <h1 class="title">Mini Runner</h1>
      <div class="stats"><button id="pauseBtn" class="top-btn" disabled>일시정지</button>
        <div>점수: <span id="score">0</span></div>
        <div>최고점수: <span id="highScore">0</span></div>
      </div>
    </header>

    <main>
      <canvas id="game" width="900" height="300" aria-label="미니 러너 게임 캔버스"></canvas>

      <section class="help">
        <p><strong>조작:</strong> 스페이스(점프) / <kbd>↓</kbd> 또는 <kbd>S</kbd>(엎드리기) · 첫 입력 시 시작</p>
        <p>선인장/새/머리 위 막대 장애물을 피하면서 오래 달리세요. 속도는 점점 빨라집니다.</p>
      </section>
    </main>

    <div id="overlay" class="overlay">
      <div class="card">
        <h2 id="ov-title">게임 방법</h2>
        <ul id="guideList" class="guide">
          <li><b>시작/점프</b>: 스페이스바 또는 화면 탭</li>
          <li><b>엎드리기</b>: <kbd>↓</kbd> 또는 <kbd>S</kbd> (눌러서 유지)</li>
          <li><b>목표</b>: 지상 <u>선인장</u>, 공중 <u>새</u>, 머리 위 <u>막대</u> 회피</li>
          <li><b>보상</b>: 점수 1000마다 <u>깃발 + 폭죽</u> 연출</li>
          <li><b>사운드</b>: 점프/통과/충돌/마일스톤 효과음</li>
        </ul>
        <p id="finalScore" style="font-weight:bold; font-size:20px; margin-bottom:10px; display:none;">최종 점수 : 0점</p>
        <button id="startBtn" class="btn">게임 시작</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
